name: lint

on:
  push:
  pull_request:

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Check zsh syntax
        run: |
          status=0
          for file in zshenv zsh_code zsh_alias zsh_functions zsh_init install.sh zshenv.local.example; do
            echo "Checking $file"
            zsh -n "$file" || status=1
          done
          exit $status
